<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Демонстраційний макет</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --blue: #3977f6;
      --dark: #002f34;
      --input-bg: #f1f2f2;
      --border: #d8dfe0;
      --green: #00a49b;
      --error: #d93025;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--blue);
      font-family: "Inter", Arial, sans-serif;
      color: var(--dark);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 3px 0;
    }

    .card {
      width: 480px;
      max-width: calc(100% - 32px);
      background: #fff;
      border-radius: 5px;
      padding: 27px 38px 34px;
      min-height: 850px;
    }

    .social-btn {
      width: 100%;
      height: 61px;
      border: 2px solid var(--dark);
      border-radius: 5px;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 13px;
      margin-bottom: 19px;
      font-family: inherit;
      font-size: 18px;
      font-weight: 700;
      color: var(--dark);
      cursor: default;
    }

    .social-btn:disabled {
      opacity: 1;
    }

    .social-btn svg {
      width: 30px;
      height: 30px;
      flex-shrink: 0;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 28px;
      margin: 24px 0 26px;
      font-size: 16px;
      font-weight: 700;
    }

    .divider::before,
    .divider::after {
      content: "";
      height: 2px;
      background: #8ba0a2;
      flex: 1;
    }

    .field {
      margin-bottom: 27px;
    }

    label {
      display: block;
      font-size: 16px;
      margin-bottom: 9px;
    }

    input {
      width: 100%;
      height: 56px;
      border: 2px solid transparent;
      border-radius: 5px;
      background: var(--input-bg);
      padding: 0 14px;
      font-family: inherit;
      font-size: 17px;
      outline: none;
    }

    input:focus {
      border-color: var(--green);
      background: #fff;
    }

    .login-btn {
      width: 100%;
      height: 57px;
      margin-top: 21px;
      border: 0;
      border-radius: 5px;
      background: #d8dfe0;
      color: #8ba0a2;
      font-family: inherit;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.15s ease;
    }

    .login-btn.active {
      background: var(--green);
      color: #fff;
    }

    .login-btn:disabled {
      cursor: default;
      opacity: 1;
    }

    .terms {
      text-align: center;
      font-size: 13px;
      line-height: 1.45;
      margin-top: 36px;
    }

    .terms strong {
      font-weight: 800;
    }

    /* =========================
       ЭКРАН ПОДТВЕРЖДЕНИЯ
       ========================= */

    .confirmation {
      display: none;
    }

    .confirmation.active {
      display: block;
    }

    .main-form.hidden {
      display: none;
    }

    .confirm-title {
      font-size: 25px;
      font-weight: 800;
      text-align: center;
      margin: 15px 0 12px;
    }

    .confirm-text {
      text-align: center;
      font-size: 15px;
      line-height: 1.5;
      margin: 0 0 30px;
    }

    .request-box {
      background: var(--input-bg);
      border-radius: 5px;
      padding: 16px;
      margin-bottom: 27px;
      font-size: 14px;
      line-height: 1.6;
    }

    .request-box strong {
      font-weight: 700;
    }

    .success {
      display: none;
      text-align: center;
    }

    .success.active {
      display: block;
    }

    .success-icon {
      width: 65px;
      height: 65px;
      margin: 20px auto;
      border-radius: 50%;
      background: var(--green);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
      font-weight: 700;
    }

    .success-title {
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 12px;
    }

    .success-text {
      font-size: 15px;
      line-height: 1.5;
    }

    .error {
      display: none;
      color: var(--error);
      font-size: 14px;
      text-align: center;
      margin-top: 15px;
      line-height: 1.4;
    }

    .error.active {
      display: block;
    }

    .loading {
      pointer-events: none;
      opacity: 0.65;
    }

    @media (max-width: 600px) {
      body {
        padding: 0;
      }

      .card {
        width: 100%;
        max-width: 100%;
        min-height: 100vh;
        border-radius: 0;
        padding: 25px 20px;
      }

      .social-btn {
        font-size: 16px;
      }
    }
  </style>
</head>

<body>

  <main class="card">

    <!-- =========================
         ПЕРВЫЙ ЭКРАН
         ========================= -->

    <div class="main-form" id="mainForm">

      <!-- Facebook -->
      <button class="social-btn" type="button" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="11" fill="#1877F2"/>
          <path fill="#fff" d="M13.5 21v-8h2.7l.4-3h-3.1V8.1c0-.9.3-1.5 1.6-1.5h1.7V4c-.3 0-1.3-.1-2.5-.1-2.5 0-4.2 1.5-4.2 4.3V10H7.4v3h2.7v8h3.4z"/>
        </svg>
        Продовжити через Facebook
      </button>

      <!-- Apple -->
      <button class="social-btn" type="button" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path fill="#000" d="M17.05 12.54c-.02-2.1 1.72-3.12 1.8-3.17a3.88 3.88 0 0 0-3.05-1.65c-1.3-.14-2.54.78-3.2.78-.67 0-1.7-.76-2.8-.74a4.13 4.13 0 0 0-3.47 2.12c-1.5 2.6-.38 6.44 1.08 8.55.73 1.03 1.56 2.18 2.68 2.14 1.08-.04 1.49-.69 2.8-.69 1.3 0 1.67.69 2.8.67 1.16-.02 1.9-1.04 2.61-2.08a8.5 8.5 0 0 0 1.2-2.4 3.72 3.72 0 0 1-2.45-3.53zM14.96 6.36A3.7 3.7 0 0 0 15.8 3a3.8 3.8 0 0 0-2.76 1.43 3.56 3.56 0 0 0-.86 2.86 3.13 3.13 0 0 0 2.78-.93z"/>
        </svg>
        Продовжити через Apple
      </button>

      <!-- Google -->
      <button class="social-btn" type="button" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path fill="#4285F4" d="M23.49 12.27c0-.79-.07-1.55-.2-2.27H12v4.3h6.45a5.5 5.5 0 0 1-2.4 3.61v3h3.88c2.27-2.09 3.56-5.17 3.56-8.64z"/>
          <path fill="#34A853" d="M12 24c3.24 0 5.95-1.07 7.93-2.9l-3.88-3c-1.07.72-2.43 1.15-4.05 1.15-3.12 0-5.77-2.11-6.72-4.95H1.27v3.09A12 12 0 0 0 12 24z"/>
          <path fill="#FBBC05" d="M5.28 14.3A7.2 7.2 0 0 1 4.9 12c0-.8.14-1.57.38-2.3V6.61H1.27A12 12 0 0 0 0 12c0 1.94.46 3.78 1.27 5.39l4.01-3.09z"/>
          <path fill="#EA4335" d="M12 4.75c1.76 0 3.34.61 4.59 1.81l3.44-3.44C17.94 1.12 15.24 0 12 0A12 12 0 0 0 1.27 6.61l4.01 3.09C6.23 6.86 8.88 4.75 12 4.75z"/>
        </svg>
        Продовжити через Google
      </button>

      <div class="divider">
        <span>чи</span>
      </div>

      <form id="couponForm">

        <div class="field">
          <label for="coupon">Ваш купленный купон</label>

          <input
            type="text"
            id="coupon"
            autocomplete="off"
          >
        </div>

        <div class="field">
          <label for="server">Сервер введиите текстом</label>

          <input
            type="text"
            id="server"
            autocomplete="off"
          >
        </div>

        <button
          class="login-btn"
          id="submitBtn"
          type="submit"
          disabled
        >
          Отправить
        </button>

        <div class="error" id="mainError"></div>

      </form>

      <div class="terms">
        Під час отправки ви погоджуєтеся з нашими
        <strong>Умови<br>користування.</strong>
      </div>

    </div>


    <!-- =========================
         ПОДТВЕРЖДЕНИЕ НИКА
         ========================= -->

    <div class="confirmation" id="confirmation">

      <div class="confirm-title">
        Это действительно Вы?
      </div>

      <div class="confirm-text">
        Для подтверждения заявки укажите ваш ник
        на сервере.
      </div>

      <div class="request-box">
        <strong>ID заявки:</strong>
        <span id="requestIdText"></span>
      </div>

      <form id="nicknameForm">

        <div class="field">
          <label for="nickname">Ваш ник</label>

          <input
            type="text"
            id="nickname"
            autocomplete="off"
            maxlength="100"
          >
        </div>

        <button
          class="login-btn"
          id="confirmBtn"
          type="submit"
          disabled
        >
          Подтвердить
        </button>

        <div class="error" id="confirmError"></div>

      </form>

    </div>


    <!-- =========================
         УСПЕШНО
         ========================= -->

    <div class="success" id="success">

      <div class="success-icon">
        ✓
      </div>

      <div class="success-title">
        Готово!
      </div>

      <div class="success-text">
        Ваша заявка подтверждена.<br>
        ID заявки:
        <strong id="successRequestId"></strong>
      </div>

    </div>

  </main>


<script>

  const couponInput = document.getElementById("coupon");
  const serverInput = document.getElementById("server");
  const submitBtn = document.getElementById("submitBtn");

  const nicknameInput = document.getElementById("nickname");
  const confirmBtn = document.getElementById("confirmBtn");

  const couponForm = document.getElementById("couponForm");
  const nicknameForm = document.getElementById("nicknameForm");

  const mainForm = document.getElementById("mainForm");
  const confirmation = document.getElementById("confirmation");
  const success = document.getElementById("success");

  const mainError = document.getElementById("mainError");
  const confirmError = document.getElementById("confirmError");

  const requestIdText = document.getElementById("requestIdText");
  const successRequestId = document.getElementById("successRequestId");

  let currentRequestId = null;


  // =========================
  // АКТИВАЦИЯ КНОПКИ
  // =========================

  function updateSubmitButton() {

    const coupon = couponInput.value.trim();
    const server = serverInput.value.trim();

    if (coupon && server) {
      submitBtn.disabled = false;
      submitBtn.classList.add("active");
    } else {
      submitBtn.disabled = true;
      submitBtn.classList.remove("active");
    }
  }


  function updateConfirmButton() {

    const nickname = nicknameInput.value.trim();

    if (nickname) {
      confirmBtn.disabled = false;
      confirmBtn.classList.add("active");
    } else {
      confirmBtn.disabled = true;
      confirmBtn.classList.remove("active");
    }
  }


  couponInput.addEventListener("input", updateSubmitButton);
  serverInput.addEventListener("input", updateSubmitButton);
  nicknameInput.addEventListener("input", updateConfirmButton);


  // =========================
  // ПЕРВАЯ ОТПРАВКА
  // =========================

  couponForm.addEventListener("submit", async function(event) {

    event.preventDefault();

    mainError.classList.remove("active");

    const coupon = couponInput.value.trim();
    const server = serverInput.value.trim();

    if (!coupon || !server) {
      return;
    }

    submitBtn.disabled = true;
    submitBtn.classList.remove("active");
    submitBtn.textContent = "Отправка...";

    try {

      const response = await fetch("/submit", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          coupon: coupon,
          server: server
        })
      });

      const data = await response.json();

      if (!response.ok || !data.success) {
        throw new Error(
          data.error || "Произошла ошибка."
        );
      }

      currentRequestId = data.request_id;

      requestIdText.textContent = currentRequestId;

      mainForm.classList.add("hidden");
      confirmation.classList.add("active");

      nicknameInput.focus();

    } catch (error) {

      mainError.textContent = error.message;
      mainError.classList.add("active");

      submitBtn.disabled = false;
      submitBtn.classList.add("active");
      submitBtn.textContent = "Отправить";
    }

  });


  // =========================
  // ПОДТВЕРЖДЕНИЕ НИКА
  // =========================

  nicknameForm.addEventListener("submit", async function(event) {

    event.preventDefault();

    confirmError.classList.remove("active");

    const nickname = nicknameInput.value.trim();

    if (!nickname || !currentRequestId) {
      return;
    }

    confirmBtn.disabled = true;
    confirmBtn.classList.remove("active");
    confirmBtn.textContent = "Проверка...";

    try {

      const response = await fetch("/confirm", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          request_id: currentRequestId,
          nickname: nickname
        })
      });

      const data = await response.json();

      if (!response.ok || !data.success) {
        throw new Error(
          data.error || "Произошла ошибка."
        );
      }

      successRequestId.textContent = currentRequestId;

      confirmation.classList.remove("active");
      success.classList.add("active");

    } catch (error) {

      confirmError.textContent = error.message;
      confirmError.classList.add("active");

      confirmBtn.disabled = false;
      confirmBtn.classList.add("active");
      confirmBtn.textContent = "Подтвердить";
    }

  });

</script>

</body>
</html>
